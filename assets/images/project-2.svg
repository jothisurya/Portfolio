    <text x="42" y="250" fill="#FFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PT</text>
    <text x="68" y="238" fill="#FFF" font-family="sans-serif" font-size="11" font-weight="bold">Pt. Raghavan</text>
    <text x="68" y="252" fill="#A5A0B8" font-family="sans-serif" font-size="9">Vedic Astrologer • 12+ Yrs</text>
    <text x="68" y="266" fill="#FBBF24" font-family="sans-serif" font-size="9">★ 4.9 (1.2k Reviews)</text>
