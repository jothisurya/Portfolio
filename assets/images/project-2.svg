    <rect x="16" y="285" width="188" height="38" rx="10" fill="url(#purpleG)"/>
    <text x="110" y="309" fill="#FFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Book Live Consultation ↗</text>
